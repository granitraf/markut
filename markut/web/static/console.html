<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markut Console</title>
<meta name="description" content="Operator console: a terminal that runs a live bull-vs-bear debate on any ticker, or replays a stored one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/debate.css">
<link rel="stylesheet" href="/static/terminal.css">
<style>
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 40vh; min-height: 100vh; cursor: text; }
  .logo { padding-top: 18px; }
  .logo h1 { font-size: 40px; }
  .term { margin-top: 18px; }
  .line { white-space: pre-wrap; word-break: break-word; min-height: 1.65em; }
  .line.dim { color: var(--muted); }
  .line.ok { color: var(--green); }
  .line.err { color: var(--bad); }
  .line.info { color: var(--accent); }
  .ps { color: var(--green); }
  .echo .ps { color: var(--muted); }
  .cmd { color: var(--ink); }
  .ghost { color: var(--muted); font-style: italic; }
  .ghost .green { color: var(--green); font-style: italic; }
  .cursor { display: inline-block; width: .62em; height: 1.15em; background: #c8c8c8; vertical-align: text-bottom; margin-left: 1px; animation: blink 1.05s steps(1) infinite; }
  .wrap.blur .cursor { animation: none; background: transparent; outline: 1px solid #8a8a8a; }
  @keyframes blink { 50% { opacity: 0; } }
  /* fixed = always inside the viewport, so focusing it never scrolls the page
     (an off-screen absolute input made every keystroke jump to the top) */
  .reader { position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }
  .out { margin: 10px 0 14px; }
  .out .timeline { gap: 10px; }
  .out .card { padding: 12px 14px; }
  .out .card.route { padding: 0 14px; }
  .help { display: grid; grid-template-columns: max-content 1fr; gap: 3px 22px; margin: 8px 0 14px 2ch; max-width: 80ch; font-size: 14px; }
  .help .hg { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; margin-top: 8px; }
  .help .hg:first-child { margin-top: 0; }
  .help .hc { color: var(--ink); white-space: nowrap; }
  .help .hd { color: var(--muted); }
  .help .green { color: var(--green); }
  .status { color: var(--muted); }
  .status b { color: var(--ink); font-weight: 500; }
  .status .pill { border-color: var(--line); }
  .tools { position: fixed; top: 12px; right: 14px; font-size: 12px; color: var(--muted); z-index: 2; }
  .tools button { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; font-size: 12px; }
  .tools button:hover { color: var(--ink); border-color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="tools"><button type="button" id="clearbtn" title="clear the screen (also: type clear, or ctrl+l)">clear</button></div>
  <header class="logo">
    <h1><a href="/">markut.dev</a></h1>
    <p>console</p>
  </header>

  <div class="term" id="term"></div>
  <div class="line" id="promptline"><span class="ps" id="ps">$ </span><span class="cmd" id="typed"></span><span class="cursor"></span><span class="ghost" id="ghost"></span></div>
  <input class="reader" id="reader" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="console input">
</div>

<script src="/static/debate.js"></script>
<script>
(function () {
  const { esc, Timeline, play } = window.Markut;
  const $ = (id) => document.getElementById(id);
  const term = $("term"), reader = $("reader"), typed = $("typed"), ghost = $("ghost"), wrap = $("wrap");

  // ---- terminal state ----
  // steps: ticker -> rounds -> confirm -> running; hints are the italic ghost text
  let step = "ticker", ticker = "", rounds = 2, running = false;
  let history = [], histIdx = -1, player = null, timer = null, startedAt = 0, statusEl = null;
  let liveEnabled = true;
  const tab = { base: "", options: [], idx: -1 };     // Tab-completion cycle
  const runsCache = {};                               // ticker -> runs (newest first)
  let tickers = [];                                   // every ticker in the archive

  const HINTS = {
    ticker: () => `input a ticker symbol`,
    rounds: () => `debate rounds: 2 (default) or 3 — Enter for 2`,
    confirm: () => `to start stock analysis, confirm with <span class="green">run debate</span>`,
    running: () => `debate in progress — output below`,
  };

  // ---- output helpers ----
  function println(html, cls = "") { const d = document.createElement("div"); d.className = "line " + cls; d.innerHTML = html; term.appendChild(d); scroll(); return d; }
  function echo(text) { println(`<span class="ps">$ </span>${esc(text)}`, "echo"); }
  function scroll() {
    const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
    if (nearBottom) window.scrollTo({ top: document.body.scrollHeight, behavior: "instant" });
  }
  function setPrompt() {
    typed.textContent = reader.value;
    ghost.innerHTML = reader.value ? "" : (HINTS[step] ? HINTS[step]() : "");
  }
  function setStep(s) { step = s; reader.value = ""; setPrompt(); }

  // ---- commands ----
  function clearScreen() {
    term.innerHTML = "";
    if (player) player.close();
    if (running) { running = false; stopClock(); }
    setStep("ticker"); window.scrollTo({ top: 0, behavior: "instant" }); reader.focus();
  }
  function help() {
    // a two-column grid, not padded spaces: commands align whatever their length
    const groups = [
      ["run a debate", [["<ticker>", "start a debate on that symbol — then rounds, then <span class=\"green\">run debate</span>"]]],
      ["stored runs", [["replay <ticker> [date]", "replay a stored run agent by agent · Tab cycles the dates"],
                       ["download <ticker> [date]", "PDF equity report of a run · Tab cycles the dates"],
                       ["runs [ticker]", "list stored runs"],
                       ["archive", "open the archive table"]]],
      ["screen", [["clear", "clear the screen · also ctrl+l or the button top right"],
                  ["cancel", "back out of a step, or stop watching a live run"]]],
      ["keys", [["Tab", "complete a ticker or cycle run dates"], ["↑ ↓", "command history"], ["ctrl+c", "cancel the current line"]]],
    ];
    const html = groups.map(([g, rows]) => `<div class="hg">${esc(g)}</div>` +
      rows.map(([c, d]) => `<div class="hc">${esc(c)}</div><div class="hd">${d}</div>`).join("")).join("");
    const box = document.createElement("div"); box.className = "help"; box.innerHTML = html; term.appendChild(box); scroll();
  }
  async function listRuns(t) {
    const runs = await fetchRuns(t);
    if (!runs.length) return println(`no stored runs${t ? " for " + esc(t) : ""}`, "dim");
    for (const r of runs) println(`  #${String(r.id).padStart(3)}  ${esc(r.started_at)}  ${esc(r.ticker).padEnd(6)}  ${esc(r.mode).padEnd(6)}  ${r.claims != null ? r.cited + "/" + r.claims + " grounded" : ""}  ${r.status !== "done" ? "· " + esc(r.status) : ""}`);
  }
  async function fetchRuns(t) {
    const key = (t || "").toUpperCase();
    if (runsCache[key]) return runsCache[key];
    try {
      const res = await fetch("/api/runs" + (key ? "?ticker=" + encodeURIComponent(key) : ""));
      const { runs } = await res.json(); runsCache[key] = runs; return runs;
    } catch (_) { return []; }
  }

  async function handle(raw) {
    const text = raw.trim();
    echo(raw);
    if (!text && step === "ticker") return;
    const [cmd, ...rest] = text.split(/\s+/);
    const low = (cmd || "").toLowerCase();

    if (low === "clear") return clearScreen();
    if (low === "help" || low === "?") return help();
    if (low === "archive") { location.href = "/console/library"; return; }
    if (low === "cancel" || low === "back") {
      if (step === "running") { if (player) player.close(); println("stopped watching — a live run keeps going on the server and lands in the archive", "dim"); running = false; stopClock(); return setStep("ticker"); }
      step !== "ticker" && println("cancelled", "dim"); return setStep("ticker");
    }

    if (step === "ticker") {
      if (low === "runs") return listRuns(rest[0]);
      if (low === "replay" || low === "download") {
        const t = (rest[0] || "").toUpperCase();
        if (!t) return println(`usage: ${low} <ticker> [date] — Tab cycles the dates`, "err");
        const runs = await fetchRuns(t);
        if (!runs.length) return println(`no stored runs for ${esc(t)}`, "err");
        const date = rest.slice(1).join(" ");
        const run = date ? runs.find((r) => r.started_at.startsWith(date)) : runs[0];
        if (!run) return println(`no ${esc(t)} run on ${esc(date)} — Tab to see the dates`, "err");
        if (low === "download") return downloadReport(run);
        return startStream(`/api/replay?run=${run.id}`, `replay ${t} · ${run.started_at}`);
      }
      const t = text.toUpperCase();
      if (!/^[A-Z]{1,5}(\.[A-Z])?$/.test(t)) return println(`${esc(text)}: not a ticker (1–5 letters, optional .X class) — type help for commands`, "err");
      if (!liveEnabled) return println("live debates are disabled on this server (no API key) — use replay <ticker>", "err");
      ticker = t; println(`ticker set to ${t}`, "dim"); return setStep("rounds");
    }
    if (step === "rounds") {
      const n = text === "" ? 2 : Number(text);
      if (!Number.isInteger(n) || n < 2 || n > 3) return println("rounds must be 2 or 3 — every debate has at least one rebuttal round", "err");
      rounds = n; println(`${n} round${n === 1 ? "" : "s"}`, "dim"); return setStep("confirm");
    }
    if (step === "confirm") {
      if (/^(run( debate)?|y|yes|go)$/.test(low + (rest.length ? " " + rest.join(" ").toLowerCase() : ""))) {
        return startStream(`/api/debate?ticker=${encodeURIComponent(ticker)}&max_rounds=${rounds}`, `run debate ${ticker} · ${rounds} round${rounds === 1 ? "" : "s"}`);
      }
      return println("type run debate to start, or cancel", "err");
    }
    if (step === "running") return println("a debate is in progress — wait for it to finish", "dim");
  }

  function downloadReport(run) {
    // the PDF is built from the stored run on request (~0.1s); an <a download> keeps the browser on this page
    const url = `/api/runs/${run.id}/report.pdf`;
    println(`» download ${esc(run.ticker)} · ${esc(run.started_at)} — <a href="${url}">markut-${esc(run.ticker)}-${esc(run.started_at.slice(0, 10))}.pdf</a>`, "info");
    const a = document.createElement("a"); a.href = url; a.download = ""; document.body.appendChild(a); a.click(); a.remove();
  }

  // ---- Tab completion ----
  async function complete() {
    const value = reader.value;
    if (tab.options.length > 1 && value === tab.options[tab.idx]) {      // cycling (a single completion falls through to the next stage: ticker -> dates)
      tab.idx = (tab.idx + 1) % tab.options.length; reader.value = tab.options[tab.idx]; setPrompt(); return;
    }
    tab.options = []; tab.idx = -1;
    let m;
    if ((m = value.match(/^(replay|download)\s+([A-Za-z.]+)\s*(.*)$/i))) {
      const verb = m[1].toLowerCase(), t = m[2].toUpperCase();
      if (!tickers.length) await loadTickers();
      const exact = tickers.includes(t);
      if (!exact) {                                                       // complete the ticker first
        tab.options = tickers.filter((x) => x.startsWith(t)).map((x) => `${verb} ${x} `);
      } else {                                                            // then cycle the run dates, newest first
        const runs = await fetchRuns(t);
        tab.options = runs.map((r) => `${verb} ${t} ${r.started_at}`);
      }
    } else if ((m = value.match(/^(replay|download)\s*$/i))) {
      const verb = m[1].toLowerCase();
      if (!tickers.length) await loadTickers();
      tab.options = tickers.map((x) => `${verb} ${x} `);
    } else if (step === "ticker" && /^[A-Za-z.]+$/.test(value)) {
      if (!tickers.length) await loadTickers();
      tab.options = tickers.filter((x) => x.startsWith(value.toUpperCase()));
    }
    if (tab.options.length) { tab.idx = 0; reader.value = tab.options[0]; setPrompt(); }
  }
  async function loadTickers() { const runs = await fetchRuns(""); tickers = [...new Set(runs.map((r) => r.ticker))]; }

  // ---- streaming output (live or replay) ----
  function startStream(url, label) {
    if (player) player.close();
    const out = document.createElement("div"); out.className = "out"; term.appendChild(out);
    statusEl = document.createElement("div"); statusEl.className = "line status"; statusEl.textContent = "connecting…"; out.appendChild(statusEl);
    const tl = document.createElement("div"); tl.className = "timeline"; out.appendChild(tl);
    running = true; setStep("running");
    const timeline = Timeline(tl, { reveal: url.includes("/api/replay"),
      onStart(d) {
        const mode = d.mode === "replay" ? "replay" : "live";
        statusEl.innerHTML = `<span class="pill ${mode}">${mode === "replay" ? "STORED RUN" : "LIVE"}</span> <b>${esc(d.ticker)}</b> · up to ${d.max_rounds} round(s) · model ${esc(d.model || "")}` +
          (d.recorded_at ? ` · recorded ${esc(d.recorded_at)}` : "") + ` · <span class="clock">0s</span>`;
        startClock();
      },
      onEnd() { stopClock(); finish(); },
      onSaved(d) {
        if (d.run) { timeline.card("route", `logged as run #${d.run} — <a href="/console?run=${d.run}">read it</a> · <a href="/api/runs/${d.run}/report.pdf">download the PDF report</a> · replay ${esc(ticker)} to watch again`); delete runsCache[ticker]; delete runsCache[""]; }
        else if (d.error) timeline.card("route", "run finished but could not be logged: " + esc(d.error));
      },
    });
    println(`» ${esc(label)}`, "info");
    player = play(url, timeline, { onClose: () => { stopClock(); finish(); } });
  }
  function finish() { if (!running) return; running = false; setStep("ticker"); scroll(); reader.focus(); }
  function startClock() { stopClock(); startedAt = Date.now(); timer = setInterval(() => { const c = statusEl && statusEl.querySelector(".clock"); if (c) c.textContent = Math.round((Date.now() - startedAt) / 1000) + "s"; }, 1000); }
  function stopClock() { if (timer) clearInterval(timer); timer = null; }

  // ---- read mode: /console?run=ID renders a stored run instantly ----
  async function openRead(id) {
    let run;
    try { const res = await fetch("/api/runs/" + encodeURIComponent(id)); if (!res.ok) throw new Error(res.status); run = await res.json(); }
    catch (_) { return println(`run #${esc(id)} not found — type runs to list`, "err"); }
    println(`» read run #${run.id} · ${esc(run.ticker)} · ${esc(run.started_at)} · ${esc(run.mode)}${run.price ? " · price " + esc(run.price) : ""}${run.claims != null ? ` · ${run.cited}/${run.claims} grounded` : ""}`, "info");
    const out = document.createElement("div"); out.className = "out"; term.appendChild(out);
    const tl = document.createElement("div"); tl.className = "timeline"; out.appendChild(tl);
    Timeline(tl, { autoscroll: false }).renderAll(run.events);
    println(`replay ${esc(run.ticker)} ${esc(run.started_at)} — to watch it with pacing · <a href="/api/runs/${run.id}/report.pdf">download the PDF report</a>`, "dim");
  }

  // ---- input plumbing: an off-screen input receives keys; the prompt line mirrors it ----
  reader.addEventListener("input", () => { tab.options = []; setPrompt(); });
  reader.addEventListener("keydown", (e) => {
    if (e.key === "Tab") { e.preventDefault(); complete(); return; }
    if (e.key === "Enter") {
      e.preventDefault(); const v = reader.value; reader.value = "";
      if (v.trim()) { history.push(v); histIdx = history.length; }
      tab.options = []; handle(v).then(setPrompt); setPrompt(); return;
    }
    if (e.key === "ArrowUp") { e.preventDefault(); if (histIdx > 0) { histIdx--; reader.value = history[histIdx]; setPrompt(); } return; }
    if (e.key === "ArrowDown") { e.preventDefault(); histIdx = Math.min(history.length, histIdx + 1); reader.value = history[histIdx] || ""; setPrompt(); return; }
    if (e.key === "l" && e.ctrlKey) { e.preventDefault(); clearScreen(); return; }
    if (e.key === "c" && e.ctrlKey && !window.getSelection().toString()) { e.preventDefault(); echo(reader.value + "^C"); reader.value = ""; if (!running) setStep("ticker"); else setPrompt(); return; }
  });
  wrap.addEventListener("mousedown", (e) => { if (!window.getSelection().toString() && e.target.tagName !== "A") setTimeout(() => reader.focus(), 0); });
  $("clearbtn").addEventListener("click", (e) => { e.stopPropagation(); clearScreen(); });
  reader.addEventListener("focus", () => wrap.classList.remove("blur"));
  reader.addEventListener("blur", () => wrap.classList.add("blur"));

  // ---- boot ----
  (async () => {
    try {
      const h = await (await fetch("/api/health")).json();
      liveEnabled = !!h.live_enabled;
      println(`markut console · model ${esc(h.model)} · store ${esc(h.db_backend)}${liveEnabled ? "" : " · live debates disabled (no API key)"}`, "dim");
    } catch (_) { println("markut console · could not reach the server", "err"); }
    println("type help for commands · clear (or ctrl+l) clears the screen", "dim");
    loadTickers();
    const want = new URLSearchParams(location.search).get("run");
    if (want) await openRead(want);
    setPrompt(); reader.focus();
  })();
})();
</script>
</body>
</html>
